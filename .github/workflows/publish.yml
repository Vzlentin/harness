name: publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  # On main, release-please opens or updates the release PR. When that PR is merged, it creates the tag and the GitHub
  # release, and the publish job runs.
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Publish the version of package.json
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "npm $(npm --version), $name@$version"
          out=$(npm view "$name@$version" version 2>&1) && found=$? || found=$?
          if [ "$found" -eq 0 ] && [ "$out" = "$version" ]; then
            echo "$name@$version is already published"
            exit 0
          fi
          if [ "$found" -ne 0 ] && ! grep -q E404 <<<"$out"; then
            echo "$out"
            echo "::error::npm view failed for $name@$version, so the job cannot tell if this version is on npm."
            exit 1
          fi
          if ! npm publish; then
            echo "::error::npm publish failed for $name@$version. See the npm error above. Fix the cause and re-run this job: the tag and the GitHub release exist already."
            exit 1
          fi
