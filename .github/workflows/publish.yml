name: publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Publish the version of package.json
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "npm $(npm --version), $name@$version"
          out=$(npm view "$name@$version" version 2>&1) && found=$? || found=$?
          if [ "$found" -eq 0 ] && [ "$out" = "$version" ]; then
            echo "$name@$version is already published"
            exit 0
          fi
          if [ "$found" -ne 0 ] && ! grep -q E404 <<<"$out"; then
            echo "$out"
            echo "::error::npm view failed for $name@$version, so the job cannot tell if this version is on npm."
            exit 1
          fi
          if ! npm publish; then
            echo "::error::npm publish failed for $name@$version. See the npm error above. CI does not retry with another version: to release, change version in package.json in a new commit."
            exit 1
          fi
